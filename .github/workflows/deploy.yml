name: Deploy SDK
on:
  release:
    types:
      - published

jobs:
  deploy:
    name: Deploy SDK to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Set Release Version
        run: echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v5
        with:
          distribution: "adopt"
          java-version: 21
          server-id: "ossrh"
          server-username: PUBLISHER_USERNAME
          server-password: PUBLISHER_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Generate SDK with Updated Version
        run: bash generate.sh --additional-properties=artifactVersion=$RELEASE_VERSION

      - name: Set Maven Project Version
        run: mvn versions:set -DnewVersion=$RELEASE_VERSION

      - name: Build Package and Test
        run: |
          mvn -B package --file pom.xml -DskipTests
          npm install -g @stoplight/prism-cli
          prism mock ./bandwidth.yml & (sleep 3; mvn test -Punit-tests)
        shell: bash

      - name: Publish to Apache Maven Central
        run: mvn deploy -DskipTests
        env:
          PUBLISHER_USERNAME: ${{ secrets.PUBLISHER_USERNAME }}
          PUBLISHER_PASSWORD: ${{ secrets.PUBLISHER_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Notify Slack
        uses: Bandwidth/build-notify-slack-action@v2
        if: always()
        with:
          job-status: ${{ job.status }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
